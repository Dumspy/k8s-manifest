bootstrap:
  repoURL: https://github.com/Dumspy/k8s-manifest
  applicationSets:
    - name: apps
      env: all
      branch: main
      path: "apps/*/*.yaml"

argocd-image-updater:
  config:
    registries:
      - name: GitHub Container Registry
        api_url: https://ghcr.io
        prefix: ghcr.io
        default: true
  crds:
    install: true
    keep: true

sso:
  github:
    # GitHub OAuth app credentials synced by the 1Password Operator.
    onePasswordItemPath: "vaults/ksplpxkiblaftafiljqytehbcy/items/462rdh47q7hba2aebr4yrktfzy"

argo-cd:
  server:
    service:
      type: ClusterIP
  configs:
    repositories:
      k8s-manifest:
        url: https://github.com/Dumspy/k8s-manifest
        name: k8s-manifest
        type: git
    cm:
      url: https://argocd.rger.dev
      dex.config: |
        connectors:
          - type: github
            id: github
            name: GitHub
            config:
              clientID: $argocd-github-sso:dex.github.clientID
              clientSecret: $argocd-github-sso:dex.github.clientSecret
              scopes:
                - user:email
                - read:org
    params:
      server.insecure: "true"
    rbac:
      policy.default: ""
      # Add one line per GitHub email that should have ArgoCD admin access.
      policy.csv: |
        g, felix.enok.berger@gmail.com, role:admin
      scopes: "[groups, email]"
  notifications:
    enabled: true
    # Used as {{.context.argocdUrl}}. The chart otherwise falls back to global.domain.
    argocdUrl: https://argocd.rger.dev
    secret:
      create: false  # using 1Password operator instead
    cm:
      create: true
    notifiers:
      service.slack: |
        token: $slack-token
        icon: https://argo-cd.readthedocs.io/en/stable/assets/logo.png
        # Leave commit links as links instead of GitHub previews.
        disableUnfurl: true
        channels: ["deployments"]
    # Slack text is one attachment so the color is the status. Commit subjects and
    # error strings are JSON-encoded (toJson) because they contain quotes and newlines.
    templates:
      template.app-deployed: |
        slack:
          attachments: |
            {{- $app := .app -}}
            {{- $rev := "" -}}
            {{- $op := "" -}}
            {{- if $app.status }}{{ $op = index $app.status "operationState" }}{{ end -}}
            {{- if $op -}}
            {{- $result := index $op "syncResult" -}}
            {{- if $result }}{{ $rev = index $result "revision" | default "" }}{{ end -}}
            {{- if not $rev -}}
            {{- $operation := index $op "operation" -}}
            {{- if $operation -}}
            {{- $sync := index $operation "sync" -}}
            {{- if $sync }}{{ $rev = index $sync "revision" | default "" }}{{ end -}}
            {{- end -}}
            {{- end -}}
            {{- end -}}
            {{- $repo := "" -}}
            {{- if $app.spec -}}
            {{- if $app.spec.source }}{{ $repo = call .repo.RepoURLToHTTPS $app.spec.source.repoURL | trimSuffix ".git" }}{{ end -}}
            {{- end -}}
            {{- $commit := "" -}}
            {{- if and $rev $repo -}}
            {{- $commit = printf "<%s/commit/%s|%s>" $repo $rev (trunc 7 $rev) -}}
            {{- $subject := index (splitList "\n" (call .repo.GetCommitMetadata $rev).Message) 0 | trim | trunc 140 -}}
            {{- if $subject }}{{ $commit = printf "%s %s" $commit $subject }}{{ end -}}
            {{- end -}}
            {{- $link := printf "%s/applications/%s/%s" .context.argocdUrl $app.metadata.namespace $app.metadata.name -}}
            {{- $text := printf ":rocket: *%s* deployed" $app.metadata.name -}}
            {{- if $commit }}{{ $text = printf "%s\n%s" $text $commit }}{{ end -}}
            {{- $text = printf "%s\n<%s|Open in Argo CD>" $text $link -}}
            [{"color":"#18be52","mrkdwn_in":["text"],"text":{{ $text | toJson }}}]
      template.app-sync-failed: |
        slack:
          attachments: |
            {{- $app := .app -}}
            {{- $rev := "" -}}
            {{- $op := "" -}}
            {{- if $app.status }}{{ $op = index $app.status "operationState" }}{{ end -}}
            {{- if $op -}}
            {{- $result := index $op "syncResult" -}}
            {{- if $result }}{{ $rev = index $result "revision" | default "" }}{{ end -}}
            {{- if not $rev -}}
            {{- $operation := index $op "operation" -}}
            {{- if $operation -}}
            {{- $sync := index $operation "sync" -}}
            {{- if $sync }}{{ $rev = index $sync "revision" | default "" }}{{ end -}}
            {{- end -}}
            {{- end -}}
            {{- end -}}
            {{- $repo := "" -}}
            {{- if $app.spec -}}
            {{- if $app.spec.source }}{{ $repo = call .repo.RepoURLToHTTPS $app.spec.source.repoURL | trimSuffix ".git" }}{{ end -}}
            {{- end -}}
            {{- $commit := "" -}}
            {{- if and $rev $repo -}}
            {{- $commit = printf "<%s/commit/%s|%s>" $repo $rev (trunc 7 $rev) -}}
            {{- $subject := index (splitList "\n" (call .repo.GetCommitMetadata $rev).Message) 0 | trim | trunc 140 -}}
            {{- if $subject }}{{ $commit = printf "%s %s" $commit $subject }}{{ end -}}
            {{- end -}}
            {{- $detail := "" -}}
            {{- if $op }}{{ $detail = index $op "message" | default "" | trim | replace "\n" " " | trunc 300 }}{{ end -}}
            {{- $link := printf "%s/applications/%s/%s" .context.argocdUrl $app.metadata.namespace $app.metadata.name -}}
            {{- $text := printf ":x: *%s* sync failed" $app.metadata.name -}}
            {{- if $commit }}{{ $text = printf "%s\n%s" $text $commit }}{{ end -}}
            {{- if $detail }}{{ $text = printf "%s\n%s" $text $detail }}{{ end -}}
            {{- $text = printf "%s\n<%s|Open in Argo CD>" $text $link -}}
            [{"color":"#E96D76","mrkdwn_in":["text"],"text":{{ $text | toJson }}}]
      template.app-health-degraded: |
        slack:
          attachments: |
            {{- $app := .app -}}
            {{- $rev := "" -}}
            {{- $op := "" -}}
            {{- if $app.status }}{{ $op = index $app.status "operationState" }}{{ end -}}
            {{- if $op -}}
            {{- $result := index $op "syncResult" -}}
            {{- if $result }}{{ $rev = index $result "revision" | default "" }}{{ end -}}
            {{- if not $rev -}}
            {{- $operation := index $op "operation" -}}
            {{- if $operation -}}
            {{- $sync := index $operation "sync" -}}
            {{- if $sync }}{{ $rev = index $sync "revision" | default "" }}{{ end -}}
            {{- end -}}
            {{- end -}}
            {{- end -}}
            {{- $repo := "" -}}
            {{- if $app.spec -}}
            {{- if $app.spec.source }}{{ $repo = call .repo.RepoURLToHTTPS $app.spec.source.repoURL | trimSuffix ".git" }}{{ end -}}
            {{- end -}}
            {{- $commit := "" -}}
            {{- if and $rev $repo -}}
            {{- $commit = printf "<%s/commit/%s|%s>" $repo $rev (trunc 7 $rev) -}}
            {{- $subject := index (splitList "\n" (call .repo.GetCommitMetadata $rev).Message) 0 | trim | trunc 140 -}}
            {{- if $subject }}{{ $commit = printf "%s %s" $commit $subject }}{{ end -}}
            {{- end -}}
            {{- $detail := "" -}}
            {{- if $app.status -}}
            {{- $health := index $app.status "health" -}}
            {{- if $health }}{{ $detail = index $health "message" | default "" | trim | replace "\n" " " | trunc 300 }}{{ end -}}
            {{- end -}}
            {{- $link := printf "%s/applications/%s/%s" .context.argocdUrl $app.metadata.namespace $app.metadata.name -}}
            {{- $text := printf ":warning: *%s* degraded" $app.metadata.name -}}
            {{- if $commit }}{{ $text = printf "%s\n%s" $text $commit }}{{ end -}}
            {{- if $detail }}{{ $text = printf "%s\n%s" $text $detail }}{{ end -}}
            {{- $text = printf "%s\n<%s|Open in Argo CD>" $text $link -}}
            [{"color":"#f4c030","mrkdwn_in":["text"],"text":{{ $text | toJson }}}]
      template.app-rollback: |
        slack:
          attachments: |
            {{- $app := .app -}}
            {{- $rev := "" -}}
            {{- $op := "" -}}
            {{- if $app.status }}{{ $op = index $app.status "operationState" }}{{ end -}}
            {{- if $op -}}
            {{- $result := index $op "syncResult" -}}
            {{- if $result }}{{ $rev = index $result "revision" | default "" }}{{ end -}}
            {{- if not $rev -}}
            {{- $operation := index $op "operation" -}}
            {{- if $operation -}}
            {{- $sync := index $operation "sync" -}}
            {{- if $sync }}{{ $rev = index $sync "revision" | default "" }}{{ end -}}
            {{- end -}}
            {{- end -}}
            {{- end -}}
            {{- $repo := "" -}}
            {{- if $app.spec -}}
            {{- if $app.spec.source }}{{ $repo = call .repo.RepoURLToHTTPS $app.spec.source.repoURL | trimSuffix ".git" }}{{ end -}}
            {{- end -}}
            {{- $commit := "" -}}
            {{- if and $rev $repo -}}
            {{- $commit = printf "<%s/commit/%s|%s>" $repo $rev (trunc 7 $rev) -}}
            {{- $subject := index (splitList "\n" (call .repo.GetCommitMetadata $rev).Message) 0 | trim | trunc 140 -}}
            {{- if $subject }}{{ $commit = printf "%s %s" $commit $subject }}{{ end -}}
            {{- end -}}
            {{- $link := printf "%s/applications/%s/%s" .context.argocdUrl $app.metadata.namespace $app.metadata.name -}}
            {{- $text := printf ":rewind: *%s* rolled back" $app.metadata.name -}}
            {{- if $commit }}{{ $text = printf "%s\n%s" $text $commit }}{{ end -}}
            {{- $text = printf "%s\n<%s|Open in Argo CD>" $text $link -}}
            [{"color":"#9c27b0","mrkdwn_in":["text"],"text":{{ $text | toJson }}}]
    # The Helm chart does not install the notifications catalog, so these are the
    # Argo CD v3.5.4 catalog triggers (notifications_catalog/triggers). oncePer is
    # the last sync result revision. status.sync.revision is the branch HEAD and
    # changes on every refresh of this monorepo, which re-fired on-deployed for
    # every app whenever any commit landed on main.
    triggers:
      trigger.on-deployed: |
        - description: Application is synced and healthy. Triggered once per commit.
          oncePer: app.status.operationState?.syncResult?.revision
          send: [app-deployed]
          when: >-
            app.status.operationState != nil
            and app.status.operationState.phase in ['Succeeded']
            and app.status.health.status == 'Healthy'
            and (!time.Parse(app.status.health.lastTransitionTime).Add(1 * time.Minute).Before(time.Parse(app.status.operationState.finishedAt))
            or time.Parse(app.status.health.lastTransitionTime).Before(time.Parse(app.status.operationState.startedAt)))
      trigger.on-health-degraded: |
        - description: Application has degraded
          oncePer: app.status.operationState?.syncResult?.revision
          send: [app-health-degraded]
          when: app.status.health.status == 'Degraded'
      trigger.on-sync-failed: |
        - description: Application syncing has failed
          oncePer: app.status.operationState?.syncResult?.revision
          send: [app-sync-failed]
          when: app.status.operationState != nil and app.status.operationState.phase in ['Error', 'Failed']
      # Not in the v3.5.4 catalog. finishedAt stays put for this operation, so a
      # later commit on main does not notify again while the rollback is still the
      # latest operation. status.sync.revision would.
      trigger.on-rollback: |
        - description: Application rolled back successfully.
          oncePer: app.status.operationState.finishedAt
          send: [app-rollback]
          when: >-
            app.status.operationState != nil
            and app.status.operationState.phase == 'Succeeded'
            and app.status.operationState.operation?.rollback != nil
