controller:
  image:
    repository: ghcr.io/dumspy/auxbot-controller
    # Immutable tag that matched the previous latest tag on 2026-10-24 (same digest).
    tag: "sha-75af7f4"
    pullPolicy: Always

  service:
    type: ClusterIP
    ports:
      api: 80
      grpc: 50051

  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 256Mi

  env:
    INACTIVITY_TIMEOUT_MINUTES: "21"

  secrets: ["DISCORD_TOKEN", "DISCORD_CLIENT_ID", "SENTRY_DSN", "CHANNEL_REMINDER_USER_IDS"]

worker:
  image:
    repository: ghcr.io/dumspy/auxbot-worker
    # Immutable tag that matched the previous latest tag on 2026-10-24 (same digest).
    tag: "sha-3843c54"

redis:
  enabled: true
  image:
    repository: redis
    tag: "8.8.2"
    pullPolicy: IfNotPresent
  storage:
    size: 1Gi
    # Empty = use the cluster default StorageClass
    storageClassName: ""
  networkPolicy:
    enabled: true
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 256Mi

rbac:
  create: true
  rules:
    - apiGroups: [""]
      resources: ["services", "pods"]
      verbs: ["create", "get", "list", "watch", "delete", "patch", "update"]
    - apiGroups: ["apps"]
      resources: ["deployments"]
      verbs: ["create", "get", "list", "watch", "delete", "patch", "update"]
