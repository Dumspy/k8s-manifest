apiVersion: argocd-image-updater.argoproj.io/v1alpha1
kind: ImageUpdater
metadata:
  name: {{ .Release.Name }}
  namespace: argocd
spec:
  namespace: argocd
  applicationRefs:
    - namePattern: {{ .Release.Name }}
      images:
        - alias: controller
          imageName: "{{ .Values.controller.image.repository }}:{{ .Values.controller.image.tag }}"
          commonUpdateSettings:
            updateStrategy: newest-build
            allowTags: "regexp:^sha-[0-9a-f]{7}$"
            ignoreTags:
              - latest
              - master
          manifestTargets:
            helm:
              name: controller.image.repository
              tag: controller.image.tag
        - alias: worker
          imageName: "{{ .Values.worker.image.repository }}:{{ .Values.worker.image.tag }}"
          commonUpdateSettings:
            updateStrategy: newest-build
            allowTags: "regexp:^sha-[0-9a-f]{7}$"
            ignoreTags:
              - latest
              - master
          manifestTargets:
            helm:
              name: worker.image.repository
              tag: worker.image.tag
