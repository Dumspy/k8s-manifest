{{- if and .Values.redis.enabled .Values.redis.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-redis
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app: {{ .Release.Name }}-redis
  policyTypes:
  - Ingress
  ingress:
  # Only the auxbot controller may reach Redis. Everything else
  # (including auxbot worker pods, labelled app=worker) is denied.
  - from:
    - podSelector:
        matchLabels:
          app: {{ .Release.Name }}-controller
    ports:
    - protocol: TCP
      port: 6379
{{- end }}
