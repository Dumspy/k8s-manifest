apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Release.Name }}
spec:
  podSelector:
    matchLabels:
      app: {{ .Release.Name }}
  policyTypes:
  - Ingress
  # cloudflared dials out to Cloudflare. Nothing in the cluster should connect
  # in, including the metrics port. Kubelet probes are not subject to NetworkPolicy.
  ingress: []
