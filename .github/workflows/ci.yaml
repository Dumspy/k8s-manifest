name: CI

# Same checks as `devenv tasks run validate:all` (scripts/validate.sh).
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Fetch pull request base
        if: github.event_name == 'pull_request'
        run: git fetch --no-tags origin "$GITHUB_BASE_REF"

      - name: Install tools
        run: |
          set -euo pipefail
          bindir="$HOME/.local/bin"
          mkdir -p "$bindir"
          curl -fsSL -o /tmp/helm.tgz https://get.helm.sh/helm-v4.2.4-linux-amd64.tar.gz
          tar -xzf /tmp/helm.tgz -C /tmp
          install -m 0755 /tmp/linux-amd64/helm "$bindir/helm"
          curl -fsSL -o /tmp/kc.tgz \
            https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz
          tar -xzf /tmp/kc.tgz -C "$bindir"
          python3 -m pip install --user --disable-pip-version-check 'yamllint==1.37.1'
          echo "$bindir" >> "$GITHUB_PATH"

      - name: Validate
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
        run: bash scripts/validate.sh
